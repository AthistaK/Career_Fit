services:
  postgres:
    image: postgres:16-alpine
    container_name: careerpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerpath_user
      POSTGRES_PASSWORD: careerpath_password
      POSTGRES_DB: careerpath_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpath_user -d careerpath_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
